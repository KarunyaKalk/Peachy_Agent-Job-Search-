services:
  # 1. FastAPI Web REST API Service
  - type: web
    name: peachy-backend-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://peachyagent-kalk.github.io,https://karunyakalk.github.io,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: peachy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: peachy-redis
          property: connectionString

  # 2. Celery Background Worker Service
  - type: worker
    name: peachy-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A backend.celery_app.worker worker --loglevel=info
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peachy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: peachy-redis
          property: connectionString

databases:
  # 3. PostgreSQL Database
  - name: peachy-postgres
    plan: free
    region: oregon

services:
  # 4. Redis Key-Value Store
  - type: redis
    name: peachy-redis
    plan: free
    region: oregon
